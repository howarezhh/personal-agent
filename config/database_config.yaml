# 数据库配置文件

# MySQL配置
mysql:
  # 环境变量配置（优先级最高）
  host_env: "MYSQL_HOST"
  port_env: "MYSQL_PORT"
  database_env: "MYSQL_DATABASE"
  username_env: "MYSQL_USERNAME"
  password_env: "MYSQL_PASSWORD"

  # 实际配置键（会从环境变量读取）
  host: "localhost"  # 如果环境变量MYSQL_HOST存在，会被覆盖
  port: 3306  # 如果环境变量MYSQL_PORT存在，会被覆盖
  database: "personal_agent"  # 如果环境变量MYSQL_DATABASE存在，会被覆盖
  username: "root"  # 如果环境变量MYSQL_USERNAME存在，会被覆盖
  password: ""  # 如果环境变量MYSQL_PASSWORD存在，会被覆盖

  # 连接池配置
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600  # 连接回收时间（秒）

  # 连接参数
  charset: "utf8mb4"
  echo: false  # 是否打印SQL语句

# Redis配置
redis:
  host_env: "REDIS_HOST"
  port_env: "REDIS_PORT"
  password_env: "REDIS_PASSWORD"
  db_env: "REDIS_DB"

  # 默认值
  default_host: "localhost"
  default_port: 6379
  default_db: 0

  # 连接池配置
  max_connections: 50
  socket_timeout: 5
  socket_connect_timeout: 5

  # 键前缀
  key_prefix: "personal_agent:"

  # 过期时间配置（秒）
  session_ttl: 86400  # 会话缓存24小时
  cache_ttl: 3600  # 普通缓存1小时

# 向量数据库配置
vector_db:
  provider: "chroma"  # chroma/pinecone/weaviate/pgvector

  # Chroma配置（本地开发）
  chroma:
    persist_directory: "./data/vectors"
    collection_name: "knowledge_base"

  # Pinecone配置（生产环境）
  pinecone:
    api_key_env: "PINECONE_API_KEY"
    environment_env: "PINECONE_ENVIRONMENT"
    index_name: "personal-agent"
    namespace: "default"

  # Weaviate配置
  weaviate:
    url_env: "WEAVIATE_URL"
    api_key_env: "WEAVIATE_API_KEY"
    class_name: "KnowledgeBase"

  # pgvector配置（使用PostgreSQL扩展）
  pgvector:
    # 使用与PostgreSQL相同的连接配置
    table_name: "embeddings"
    vector_dimension: 1024

# 数据库迁移配置
migration:
  directory: "./backend/database/migrations"
  auto_upgrade: false  # 是否自动升级数据库
