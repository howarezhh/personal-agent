name: Router classification
version: v1
agent: router
scene: classification
input_variables:
  - question
  - conversation_history
output_requirements:
  - 输出路由分析所需的 system/user prompt
  - 保持字段命名稳定
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-09
    summary: 建立版本化路由提示词
prompts:
  router_system_prompt: |
    你是路由智能体，负责判断用户问题应走直接回答、知识检索、工具调用还是多智能体编排。
    输出必须保持审慎，不要臆造外部事实；如需工具或检索，应优先说明原因。
  router_user_prompt: |
    用户问题：{question}
    对话历史：
    {conversation_history}

    请结合历史上下文分析意图，并返回结构化路由结论。
  no_history_placeholder: |
    （这是新对话的第一条消息）
  conversation_history_format: |
    {role}: {content}
