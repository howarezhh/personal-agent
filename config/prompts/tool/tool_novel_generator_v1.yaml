name: Tool novel generator
version: v1
agent: tool
scene: novel_generator
input_variables:
- title
- genre_name
- style_name
- theme
- chapter_number
- chapter_title
- outline_text
- word_count
- character_name
- context
output_requirements:
- 为小说生成工具提供稳定提示词
applicable_models:
- gpt-4o-mini
change_log:
- version: v1
  date: 2026-03-09
  summary: 外置小说生成工具提示词
- version: v1
  date: '2026-03-19'
  summary: Remove legacy structured-output wording and old history placeholder coupling.
prompts:
  novel_generator_outline_prompt: '请为以下小说生成详细大纲。


    标题：{title}

    类型：{genre_name}

    风格：{style_name}

    主题简介：{theme}


    请完整给出故事背景、主要角色、核心冲突、情节阶段和章节规划。

    '
  novel_generator_chapter_prompt: '请创作小说第 {chapter_number} 章。


    章节标题：{chapter_title}

    类型：{genre_name}

    风格：{style_name}

    目标字数：{word_count}

    大纲：{outline_text}


    要求：情节连贯、人物一致、节奏自然，直接输出章节内容。

    '
  novel_generator_character_prompt: '请为以下小说创建详细角色设定。


    角色名称：{character_name}

    类型：{genre_name}

    主题：{theme}


    请完整给出基础信息、性格、背景故事、能力、人际关系、目标与弱点。

    '
  novel_generator_worldview_prompt: '请为以下小说创建详细世界观设定。


    标题：{title}

    类型：{genre_name}

    主题：{theme}


    请完整给出世界背景、社会结构、力量体系、组织势力、特殊规则、重要地点和独特设定。

    '
  novel_generator_continue_prompt: '请根据以下前文续写小说。


    类型：{genre_name}

    风格：{style_name}

    目标字数：{word_count}

    前文：

    {context}


    要求：保持风格一致、情节推进、人物稳定，直接输出续写内容。

    '
