name: Tool script generator
version: v1
agent: tool
scene: script_generator
input_variables:
- title
- type_name
- style_name
- duration
- target_audience
- theme
- scene_number
- scene_description
- characters
- outline_text
- outline_json
output_requirements:
- 为脚本生成工具提供稳定提示词
applicable_models:
- gpt-4o-mini
change_log:
- version: v1
  date: 2026-03-09
  summary: 外置脚本生成工具提示词
- version: v1
  date: '2026-03-19'
  summary: Remove legacy structured-output wording and old history placeholder coupling.
prompts:
  script_generator_outline_prompt: '请为以下 {type_name} 生成详细大纲。


    标题：{title}

    风格：{style_name}

    时长：{duration}

    目标受众：{target_audience}

    主题：{theme}


    请完整给出故事梗概、角色、核心冲突、场景设置、情节结构和场次规划。

    '
  script_generator_scene_prompt: '请为 {type_name} 创作第 {scene_number} 场详细脚本。


    场景描述：{scene_description}

    出场角色：{characters}

    风格：{style_name}

    大纲：{outline_text}


    请输出完整场景脚本，包含场景说明、动作、对白和必要的镜头提示。

    '
  script_generator_dialogue_prompt: '请为 {type_name} 创作一段对白。


    场景：{scene_description}

    角色：{characters}

    风格：{style_name}


    要求：对白自然流畅，能推进情节或展现人物关系。

    '
  script_generator_storyboard_prompt: '请为 {type_name} 创作分镜脚本。


    场景描述：{scene_description}

    风格：{style_name}


    请完整给出镜号、景别、运镜、画面描述、时长、音效和对白。

    '
  script_generator_complete_prompt: '请根据以下大纲创作完整的 {type_name}。


    标题：{title}

    风格：{style_name}

    时长：{duration}

    大纲：

    {outline_json}


    请输出完整脚本，包含标题页、角色表、完整场次和结尾。

    '
