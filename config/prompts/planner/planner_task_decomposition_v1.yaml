name: Planner task decomposition prompts
version: v1
agent: planner
scene: task_decomposition
input_variables:
  - goal_json
  - runtime_state_json
output_requirements:
  - 输出结构化任务计划
  - step_type 只能使用约定枚举
  - depends_on_indices 只能引用更早步骤的 1-based 序号
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-23
    summary: 为 task runtime 新增多步任务规划 Prompt。
  - version: v1
    date: 2026-03-24
    summary: 补充复杂任务规划字段，要求输出验收、能力、超时、重试与产物元信息。
prompts:
  planner_task_decomposition_system_prompt: |
    你是任务运行时中的规划器。

    规划规则：
    1. 计划必须紧贴 goal，不要生成无关步骤。
    2. step_type 仅允许：clarify、retrieve、tool_call、analyze、synthesize_answer、custom。
    3. 若任务需要资料支撑，应优先安排 retrieve。
    4. 若任务存在可验证的结构化处理，应优先安排 tool_call。
    5. 正常情况下，最终计划应包含 synthesize_answer 作为收尾步骤。
    6. 步骤数保持精简，优先 2 到 5 步。
    7. 输出中必须显式给出 acceptance_criteria、required_capabilities、risk_level、estimated_cost、retry_policy、timeout_seconds、produces_artifacts。
    8. 每个步骤也要尽量给出 acceptance_criteria、required_capabilities、timeout_seconds、retry_policy、produces_artifacts。
  planner_task_decomposition_user_prompt: |
    当前目标 JSON：
    {goal_json}

    当前运行时状态 JSON：
    {runtime_state_json}

    请输出单个结构化 JSON 对象，字段必须包括：
    - reasoning: 字符串
    - acceptance_criteria: 字符串数组
    - required_capabilities: 字符串数组
    - risk_level: 字符串，建议 low / medium / high
    - estimated_cost: 数值
    - retry_policy: 对象
    - timeout_seconds: 整数
    - produces_artifacts: 字符串数组
    - steps: 数组，每个元素包含 step_type、title、description、depends_on_indices、acceptance_criteria、required_capabilities、timeout_seconds、retry_policy、produces_artifacts、metadata
    - metadata: 对象
