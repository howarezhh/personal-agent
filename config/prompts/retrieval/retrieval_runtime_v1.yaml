name: Retrieval runtime prompts
version: v1
agent: retrieval
scene: runtime_defaults
input_variables:
  - question
  - file_type_hint
  - retrieval_context
output_requirements:
  - 生成结构化查询改写结果
  - 提供检索为空时的统一文案
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-18
    summary: 初始化检索运行时提示词。
  - version: v1
    date: 2026-03-21
    summary: 删除死 Prompt 与旧历史模板，仅保留实际使用的检索提示词。
  - version: v1
    date: 2026-03-23
    summary: 增加文件类型与检索上下文变量，约束查询改写更贴近真实检索范围。
prompts:
  query_rewrite_prompt: |
    你是检索查询改写器。

    用户问题：{question}
    目标文档类型：{file_type_hint}
    当前检索上下文：{retrieval_context}

    任务要求：
    1. 结合上面的对话消息理解用户真实检索意图。
    2. 优先围绕目标文档类型和当前过滤条件生成 1 到 3 条适合知识检索的改写查询。
    3. 提取覆盖主题词、对象名、章节名、表格名、函数名等关键信号的关键词列表。
    4. reasoning 只说明改写依据，不要写空话。
    5. 不要把“优化查询 1”“核心意图”等占位文本当作真实查询输出。
  no_results_prompt: |
    抱歉，我在当前知识库中没有找到与您问题直接相关的信息。

    您可以：
    1. 换一种问法；
    2. 提供更具体的关键词；
    3. 指定要查询的文档、资料或上传文件范围。
