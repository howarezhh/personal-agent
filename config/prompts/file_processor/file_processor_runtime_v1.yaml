name: File processor runtime prompts
version: v1
agent: file_processor
scene: runtime_defaults
input_variables:
  - filename
  - file_type
  - total_pages
  - chunk_count
  - content_preview
  - max_size
  - current_size
  - file_format
  - supported_formats
  - error_message
output_requirements:
  - 提供文件摘要生成提示词
  - 提供统一文件处理错误提示词
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-18
    summary: 初始化文件处理运行时提示词。
  - version: v1
    date: 2026-03-21
    summary: 删除重复摘要 Prompt、死 Prompt 与旧历史模板，仅保留实际使用项。
prompts:
  file_processor_system_prompt: |
    你是专业的文档分析助手，负责为上传文档生成简洁、准确、客观的摘要。

    要求：
    1. 准确提炼主题与核心观点。
    2. 优先保留关键事实、数据与结论。
    3. 摘要控制在 200 字以内。
    4. 不添加原文之外的臆测与评价。
  summary_generation_prompt: |
    请为以下文档生成简洁摘要。

    文件名：{filename}
    文件类型：{file_type}
    总页数：{total_pages}
    文本块数：{chunk_count}

    文档内容预览：
    {content_preview}

    请直接输出摘要正文。
  error_handling:
    file_too_large: |
      文件大小超过限制（{max_size}MB）。
      当前文件大小：{current_size}MB。
      请压缩文件后重试，或联系管理员调整限制。
    unsupported_format: |
      不支持的文件格式：{file_format}。
      当前支持的格式：{supported_formats}。
      请转换为支持的格式后再上传。
    corrupted_file: |
      文件可能已损坏，暂时无法解析。
      请检查文件完整性，或重新导出后重试。
    parsing_failed: |
      文件解析失败：{error_message}
      请确认文件内容可正常打开，或改用标准格式后重试。
    vectorization_failed: |
      文档已完成解析与分块，但向量化失败，暂时无法参与检索。
      请稍后重试，或联系管理员检查向量服务状态。
    unknown_error: |
      文件处理失败：{error_message}
      请稍后重试，或联系管理员协助排查。
