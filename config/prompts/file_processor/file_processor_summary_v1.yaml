name: File processor summary
version: v1
agent: file_processor
scene: summary
input_variables:
  - filename
  - file_type
  - total_pages
  - chunk_count
  - content_preview
output_requirements:
  - 生成文档摘要提示词
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-09
    summary: 建立文件处理版本化提示词
prompts:
  summary_generation_prompt: |
    请为以下文档生成简洁摘要。
    文件名：{filename}
    文件类型：{file_type}
    总页数：{total_pages}
    文本块数：{chunk_count}
    内容预览：
    {content_preview}
