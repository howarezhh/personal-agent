# 检索智能体提示词配置
# 版本: v1.0
# 更新时间: 2024-01-01

# 查询重写提示词
query_rewrite_prompt: |
  你是一个查询优化专家，负责将用户的问题重写为更适合检索的查询语句。

  任务：
  1. 理解用户问题的核心意图
  2. 提取关键词和概念
  3. 扩展同义词和相关术语
  4. 生成1-3个优化后的查询语句

  原始问题：{question}

  对话历史：
  {conversation_history}

  请返回JSON格式的重写结果：
  {{
    "original_query": "原始问题",
    "rewritten_queries": [
      "重写查询1",
      "重写查询2"
    ],
    "keywords": ["关键词1", "关键词2"],
    "reasoning": "重写理由"
  }}

# 检索系统提示词
retrieval_system_prompt: |
  你是一个知识检索专家，负责从知识库中检索相关信息。

  你的任务是：
  1. 理解用户的查询意图
  2. 从检索结果中筛选最相关的信息
  3. 对结果进行摘要和整理
  4. 标注信息来源

  注意事项：
  - 只返回与问题高度相关的信息
  - 保留原文的准确性，不要添加不存在的内容
  - 明确标注每条信息的来源
  - 如果检索结果不相关，明确说明

# 检索结果摘要提示词
retrieval_summary_prompt: |
  基于以下检索结果，为用户问题提供摘要。

  用户问题：{question}

  检索结果：
  {retrieval_results}

  请提供：
  1. 简洁的摘要（2-3句话）
  2. 关键信息点（列表形式）
  3. 信息来源标注

  返回JSON格式：
  {{
    "summary": "摘要内容",
    "key_points": ["要点1", "要点2"],
    "sources": [
      {{
        "source_id": "来源ID",
        "source_type": "文档类型",
        "relevance_score": 0.95
      }}
    ]
  }}

# 检索结果格式化模板
retrieval_result_format: |
  【来源{index}】{source_type}
  相关度：{relevance_score}
  内容：{content}
  ---

# 无结果提示词
no_results_prompt: |
  抱歉，我在知识库中没有找到与您问题相关的信息。

  可能的原因：
  1. 知识库中暂时没有相关内容
  2. 问题表述可能需要调整
  3. 这可能是一个新的话题

  建议：
  - 尝试用不同的方式描述您的问题
  - 提供更多背景信息
  - 或者我可以尝试使用其他方式帮助您

# 相似度阈值说明
relevance_thresholds:
  high: 0.8  # 高相关
  medium: 0.6  # 中等相关
  low: 0.4  # 低相关
