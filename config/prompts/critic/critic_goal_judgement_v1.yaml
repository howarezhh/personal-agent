name: Critic goal judgement prompts
version: v1
agent: critic
scene: goal_judgement
input_variables:
  - goal_json
  - runtime_state_json
output_requirements:
  - 输出结构化目标完成度判断
  - 明确 missing_items 与 final_output
  - completion_score 取值范围为 0 到 1
applicable_models:
  - gpt-4o-mini
change_log:
  - version: v1
    date: 2026-03-23
    summary: 为 task runtime 新增整体目标判定 Prompt。
  - version: v1
    date: 2026-03-24
    summary: 增加最终验收报告字段，要求输出已满足标准、风险和改进建议。
prompts:
  critic_goal_judgement_system_prompt: |
    你是任务运行时中的目标判定器。

    判定规则：
    1. 只有在已经形成可交付结果时，才可判断为 goal_completed。
    2. 若仍有关键缺口，missing_items 必须明确列出。
    3. 若已有 final_output，请直接返回当前最合适的最终结果文本。
    4. reasoning 应解释完成或未完成的核心依据。
    5. 同时要输出 satisfied_criteria、risks、recommendations，用于最终验收报告。
  critic_goal_judgement_user_prompt: |
    当前目标 JSON：
    {goal_json}

    当前运行时状态 JSON：
    {runtime_state_json}

    请输出单个结构化 JSON 对象，字段必须包括：
    - goal_completed: 布尔值
    - completion_score: 数值
    - missing_items: 字符串数组
    - satisfied_criteria: 字符串数组
    - risks: 字符串数组
    - recommendations: 字符串数组
    - reasoning: 字符串
    - final_output: 字符串或 null
    - metadata: 对象
