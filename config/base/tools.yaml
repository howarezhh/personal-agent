      class_path: backend.tools.web_search.web_search_tool.WebSearchTool
  database_query:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
    expose_to_agent: true
    implementation:
      class_path: backend.tools.database_query.database_query_tool.DatabaseQueryTool
  translation:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
    expose_to_agent: true
    implementation:
      class_path: backend.tools.translation.translation_tool.TranslationTool
  datetime:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
    expose_to_agent: true
    implementation:
      class_path: backend.tools.datetime.datetime_tool.DateTimeTool
  novel_generator:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
    expose_to_agent: true
