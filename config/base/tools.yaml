registry:
  calculator:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
    expose_to_agent: true
    implementation:
      class_path: backend.tools.calculator.calculator_tool.CalculatorTool
  web_search:
    enabled: true
    transport_protocol: mcp
    tool_origin: local
    mcp_server: builtin
