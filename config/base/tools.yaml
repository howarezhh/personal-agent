  ip_lookup_mcp:
    enabled: true
    transport_protocol: mcp
    tool_origin: external
    mcp_server: builtin
    expose_to_agent: true
    implementation:
      class_path: backend.tools.mcp.ip_lookup_mcp.IPLookupMCP

common:
  default_timeout: 30
  enable_cache: true
  cache_ttl: 300
  max_retries: 3

calculator:
  max_expression_length: 1000
  timeout: 5

web_search:
  api_url: https://serpapi.com/search
  timeout: 15
  max_results: 10

database:
  timeout: 30

mcp:
  protocol_version: "2025-11-25"
  timeout: 10
  max_retries: 3
  retry_delay: 1.0
  servers:
    builtin:
      enabled: true
      transport: stdio
      module: backend.tools.mcp.builtin_server

news_mcp:
  api_endpoint: https://newsapi.org/v2/top-headlines
  api_key: ""

weather_mcp:
  api_endpoint: https://api.open-meteo.com/v1/forecast

wikipedia_mcp:
  api_endpoint_zh: https://zh.wikipedia.org/w/api.php
  api_endpoint_en: https://en.wikipedia.org/w/api.php

exchange_rate_mcp:
  api_endpoint: https://open.er-api.com/v6/latest

ip_lookup_mcp:
  api_endpoint: https://ipapi.co
