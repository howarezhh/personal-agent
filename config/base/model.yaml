# 模型配置文件
# 用于配置 LLM、Embedding 等能力

primary_model:
  provider: "zhipu"
  model_name: "glm-4"
  api_key_env: "ZHIPU_API_KEY"
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.9
  timeout: 60

fallback_model:
  provider: "openai"
  model_name: "gpt-4"
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.9
  timeout: 60

embedding_model:
  provider: "local"
  model_name: "BAAI/bge-small-zh-v1.5"
  local_model_path: "BAAI/bge-small-zh-v1.5"
  local_files_only: true
  max_input_tokens: 512
  reserved_tokens: 32
  dimension: 512
  batch_size: 32
  device: "cpu"
  normalize_embeddings: true
  pooling: "cls"
  enable_retrieval_instruction: true
  query_instruction_for_retrieval: "为这个句子生成表示以用于检索相关文档："
  document_instruction_for_retrieval: ""

rerank_model:
  provider: "local_cross_encoder"
  model_name: "models/bge-reranker-base"
  local_model_path: "models/bge-reranker-base"
  local_files_only: true
  batch_size: 8
  device: "auto"
  enable_secondary_rerank: true
  secondary_local_model_path: "models/bge-reranker-large"
  secondary_local_files_only: true
  secondary_batch_size: 4
  secondary_device: "auto"
  secondary_top_n: 8
  secondary_score_weight: 0.75
  secondary_trigger_min_score: 0.72
  secondary_trigger_score_gap: 0.04

streaming:
  enabled: true
  chunk_size: 10
  delay_ms: 50

retry:
  max_retries: 3
  retry_delay: 1
  exponential_backoff: true
