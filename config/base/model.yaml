# 模型配置文件
# 用于配置 LLM、Embedding 等能力

primary_model:
  provider: "zhipu"
  model_name: "glm-4"
  api_key_env: "ZHIPU_API_KEY"
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.9
  timeout: 60

fallback_model:
  provider: "openai"
  model_name: "gpt-4"
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.9
  timeout: 60

embedding_model:
  provider: "local"
  model_name: "BAAI/bge-small-zh-v1.5"
  local_model_path: "BAAI/bge-small-zh-v1.5"
  local_files_only: true
  dimension: 512
  batch_size: 32
  device: "cpu"
  normalize_embeddings: true
  pooling: "cls"

streaming:
  enabled: true
  chunk_size: 10
  delay_ms: 50

retry:
  max_retries: 3
  retry_delay: 1
  exponential_backoff: true
