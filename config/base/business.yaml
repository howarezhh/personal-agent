api:
  host: "0.0.0.0"
  port: 8000
  debug: true
  reload: true
  workers: 4
  cors:
    allow_origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3001"
      - "http://127.0.0.1:5173"
    allow_origin_regex: "^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$"
    allow_credentials: true
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "PATCH"
    allow_headers:
      - "*"
  rate_limit:
    enabled: true
    default_limit: 100
    default_window: 60
    endpoints:
      "/api/v1/auth/login":
        limit: 5
        window: 60
      "/api/v1/auth/register":
        limit: 3
        window: 3600
      "/api/v1/chat/ask":
        limit: 30
        window: 60

jwt:
  secret_key_env: "JWT_SECRET_KEY"
  algorithm: "HS256"
  access_token_expire_minutes: 1440
  refresh_token_expire_days: 30

file_upload:
  upload_directory: "./data/uploads"
  max_file_size_mb: 50
  allowed_extensions:
    - "pdf"
    - "docx"
    - "pptx"
    - "xlsx"
    - "xls"
    - "csv"
    - "tsv"
    - "html"
    - "htm"
    - "svg"
    - "txt"
    - "rst"
    - "log"
    - "md"
    - "markdown"
    - "json"
    - "xml"
    - "png"
    - "jpg"
    - "jpeg"
    - "gif"
    - "bmp"
    - "webp"
    - "py"
    - "js"
    - "ts"
    - "tsx"
    - "jsx"
    - "java"
    - "c"
    - "cpp"
    - "cc"
    - "cxx"
    - "h"
    - "hpp"
    - "go"
    - "rs"
    - "rb"
    - "php"
    - "cs"
    - "swift"
    - "kt"
    - "kts"
    - "scala"
    - "sh"
    - "bash"
    - "zsh"
    - "bat"
    - "ps1"
    - "sql"
    - "yaml"
    - "yml"
    - "toml"
    - "ini"
    - "cfg"
    - "conf"
    - "env"
    - "properties"
    - "css"
    - "scss"
    - "less"
    - "vue"
    - "gitignore"
  auto_cleanup: true
  cleanup_after_days: 30

knowledge:
  chunk_size: 800
  chunk_overlap: 100
  supported_types:
    - "pdf"
    - "docx"
    - "pptx"
    - "xlsx"
    - "xls"
    - "csv"
    - "tsv"
    - "html"
    - "htm"
    - "svg"
    - "txt"
    - "rst"
    - "log"
    - "md"
    - "markdown"
    - "json"
    - "xml"
    - "png"
    - "jpg"
    - "jpeg"
    - "gif"
    - "bmp"
    - "webp"
    - "py"
    - "js"
    - "ts"
    - "tsx"
    - "jsx"
    - "java"
    - "c"
    - "cpp"
    - "cc"
    - "cxx"
    - "h"
    - "hpp"
    - "go"
    - "rs"
    - "rb"
    - "php"
    - "cs"
    - "swift"
    - "kt"
    - "kts"
    - "scala"
    - "sh"
    - "bash"
    - "zsh"
    - "bat"
    - "ps1"
    - "sql"
    - "yaml"
    - "yml"
    - "toml"
    - "ini"
    - "cfg"
    - "conf"
    - "env"
    - "properties"
    - "css"
    - "scss"
    - "less"
    - "vue"
    - "gitignore"
  embedding:
    batch_size: 10
    max_retries: 3
  retrieval:
    default_top_k: 5
    max_top_k: 20
    min_similarity_score: 0.5

logging:
  level: "INFO"
  format: "json"
  output:
    - "console"
    - "file"
  file:
    directory: "./.runtime/logs"
    filename: "app.log"
    max_bytes: 10485760
    backup_count: 10
    rotation: "size"
  include_timestamp: true
  include_level: true
  include_module: true
  include_function: true

monitoring:
  enabled: true
  metrics_port: 9090
  track_response_time: true
  track_token_usage: true
  track_agent_execution: true
  alerts:
    slow_response_threshold_ms: 5000
    error_rate_threshold: 0.05

cache:
  enabled: true
  backend: "redis"
  strategies:
    conversation_history:
      ttl: 3600
      max_size: 1000
    retrieval_results:
      ttl: 1800
      max_size: 500
    user_sessions:
      ttl: 86400
      max_size: 10000

security:
  csrf:
    enabled: true
    secret_key_env: "CSRF_SECRET_KEY"
    token_name: "csrf_token"
    header_name: "X-CSRF-Token"
    cookie_name: "csrf_token"
    safe_methods:
      - "GET"
      - "HEAD"
      - "OPTIONS"
      - "TRACE"
  password:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_digit: true
    require_special_char: false
  login:
    max_attempts: 5
    lockout_duration_minutes: 30
  data_masking:
    enabled: true
    mask_email: true
    mask_phone: true
