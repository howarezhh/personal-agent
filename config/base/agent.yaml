# 智能体配置文件

# 通用配置
common:
  max_iterations: 10  # 最大迭代次数
  timeout: 300  # 超时时间（秒）
  enable_streaming: true  # 是否启用流式输出
  save_execution_records: true  # 是否保存执行记录

# 检索智能体配置
retrieval_agent:
  agent_name: "RetrievalAgent"
  agent_type: "retrieval"
  model: "primary"
  temperature: 0.5
  max_tokens: 1000
  prompt_template: "retrieval_system_prompt"

  # 检索参数
  top_k: 10  # 返回前 k 个结果
  similarity_threshold: 0.3  # 相似度阈值（L2 距离转换后的相似度范围约 0-0.5，0.3 为较合理阈值）
  enable_rerank: true  # 是否启用重排序
  rerank_top_k: 10  # 重排序后返回的结果数
  enable_semantic_rerank: true
  semantic_rerank_weight: 0.75
  diversity_weight: 0.05
  enable_summary: false  # 是否生成检索结果摘要（使用 LLM，会增加延迟）
  fusion_strategy: "rrf"
  rrf_k: 60
  vector_distance_metric: "l2"
  vector_similarity_calibration: "auto"
  sparse_index_cache_enabled: true
  sparse_index_cache_ttl_seconds: 1800
  sparse_index_cache_max_entries: 64
  query_decomposition_max_queries: 2
  keyword_query_max_queries: 2
  max_retrieval_candidates: 30
  max_rerank_results: 10
  force_hybrid_retrieval: true
  force_exact_phrase: true
  force_sparse_keyword: true
  force_dense_vector: true
  force_rerank: true
  min_rerank_score: 0.45
  relative_score_floor_ratio: 0.75
  max_score_gap: 0.18
  min_query_relevance_score: 0.28
  min_semantic_rerank_score: 0.55
  semantic_agreement_bonus: 0.08
  semantic_disagreement_penalty: 0.12

  # 查询重写
  enable_query_rewrite: true
  query_rewrite_prompt: "query_rewrite_prompt"

# 生成智能体配置
generation_agent:
  agent_name: "GenerationAgent"
  agent_type: "generation"
  model: "primary"
  temperature: 0.7
  max_tokens: 2000
  prompt_template: "generation_system_prompt"

  # 生成参数
  enable_citation: true  # 是否引用来源
  enable_hallucination_check: true  # 是否检查幻觉
  max_context_length: 4000  # 最大上下文长度

  # 流式输出
  streaming_chunk_size: 10

# 工具调用智能体配置
tool_agent:
  agent_name: "ToolAgent"
  agent_type: "tool"
  model: "primary"
  temperature: 0.3
  max_tokens: 1000
  prompt_template: "tool_selection_prompt"

  # 工具配置
  available_tools:
    - "web_search"
    - "calculator"
    - "database_query"
    - "translation"
    - "datetime"
    - "novel_generator"
    - "script_generator"
    - "content_optimizer"
    - "weather_mcp"
    - "news_mcp"
    - "wikipedia_mcp"
    - "exchange_rate_mcp"
    - "ip_lookup_mcp"

  # 超时和重试配置
  tool_timeout: 30  # 工具调用超时时间（秒）
  max_retries: 2  # 最大重试次数（失败后重试）
  retry_delay: 1.0  # 重试延迟（秒）
  max_tool_calls: 5  # 最大工具调用次数

  # 性能监控
  enable_performance_monitoring: true  # 是否启用性能监控
  log_performance_stats: true  # 是否记录性能统计到日志

# 文档处理 Agent 配置
file_processor_agent:
  agent_name: "FileProcessorAgent"
  agent_type: "file_processor"
  model: "primary"
  temperature: 0.5
  max_tokens: 1500

  # 支持的文件类型
  supported_formats:
    - "pdf"
    - "docx"
    - "pptx"
    - "xlsx"
    - "xls"
    - "csv"
    - "tsv"
    - "html"
    - "htm"
    - "svg"
    - "txt"
    - "rst"
    - "log"
    - "md"
    - "markdown"
    - "json"
    - "xml"
    - "png"
    - "jpg"
    - "jpeg"
    - "gif"
    - "bmp"
    - "webp"
    - "py"
    - "js"
    - "ts"
    - "tsx"
    - "jsx"
    - "java"
    - "c"
    - "cpp"
    - "cc"
    - "cxx"
    - "h"
    - "hpp"
    - "go"
    - "rs"
    - "rb"
    - "php"
    - "cs"
    - "swift"
    - "kt"
    - "kts"
    - "scala"
    - "sh"
    - "bash"
    - "zsh"
    - "bat"
    - "ps1"
    - "sql"
    - "yaml"
    - "yml"
    - "toml"
    - "ini"
    - "cfg"
    - "conf"
    - "env"
    - "properties"
    - "css"
    - "scss"
    - "less"
    - "vue"
    - "gitignore"

  # 文件大小限制（MB）
  max_file_size: 50

  # 文本分块参数
  chunk_size: 1000
  chunk_overlap: 100

# Agent 运行期通用配置
agent:
  conversation_history:
    max_history_length: 10  # 最大历史长度
    include_agent_executions: true  # 是否包含 Agent 执行记录
    format: "messages"  # messages/text

  # task runtime 的 LLM 组件配置。
  # 默认开启 LLM 主链路；若模型运行时初始化失败，则按 fallback_to_rule_based 自动回退。
  task_runtime:
    enable_llm_components: true
    fallback_to_rule_based: true
    model: "primary"
    goal_parser_enabled: true
    planner_enabled: true
    step_evaluator_enabled: true
    goal_judge_enabled: true
    replanner_enabled: true
    goal_parser_temperature: 0.2
    planner_temperature: 0.2
    critic_temperature: 0.1
    replanner_temperature: 0.2
    max_tokens: 1400
    prepared_session_ttl_seconds: 300  # prepare 缓存 TTL，避免只调 `/tasks` 时长期占用内存

