# 鏅鸿兘浣撻厤缃枃浠?

# 閫氱敤閰嶇疆
common:
  max_iterations: 10  # 鏈€澶ц凯浠ｆ鏁?
  timeout: 300  # 瓒呮椂鏃堕棿锛堢锛?
  enable_streaming: true  # 鏄惁鍚敤娴佸紡杈撳嚭
  save_execution_records: true  # 鏄惁淇濆瓨鎵ц璁板綍

# 璺敱鏅鸿兘浣撻厤缃?
router_agent:
  agent_name: "RouterAgent"
  agent_type: "router"
  model: "primary"  # 浣跨敤涓绘ā鍨?
  temperature: 0.3  # 杈冧綆娓╁害锛屼繚璇佸喅绛栫ǔ瀹氭€?
  max_tokens: 500
  prompt_template: "router_system_prompt"  # 鎻愮ず璇嶆ā鏉垮悕绉?

  # 鍐崇瓥绫诲瀷
  decision_types:
    - "direct_answer"  # 鐩存帴鍥炵瓟
    - "retrieval"  # 妫€绱㈢煡璇嗗簱
    - "tool_call"  # 璋冪敤宸ュ叿
    - "multi_agent"  # 澶氭櫤鑳戒綋鍗忎綔

  # 缃俊搴﹂槇鍊?
  confidence_threshold: 0.7

# 妫€绱㈡櫤鑳戒綋閰嶇疆
retrieval_agent:
  agent_name: "RetrievalAgent"
  agent_type: "retrieval"
  model: "primary"
  temperature: 0.5
  max_tokens: 1000
  prompt_template: "retrieval_system_prompt"

  # 妫€绱㈠弬鏁?
  top_k: 10  # 杩斿洖鍓岾涓粨鏋?
  similarity_threshold: 0.3  # 鐩镐技搴﹂槇鍊硷紙L2璺濈杞崲鍚庣殑鐩镐技搴﹁寖鍥寸害0-0.5锛?.3鏄悎鐞嗙殑闃堝€硷級
  enable_rerank: true  # 鏄惁鍚敤閲嶆帓搴?
  rerank_top_k: 10  # 閲嶆帓搴忓悗杩斿洖鐨勭粨鏋滄暟
  enable_summary: false  # 鏄惁鐢熸垚妫€绱㈢粨鏋滄憳瑕侊紙浣跨敤LLM锛屼細澧炲姞寤惰繜锛?

  # 鏌ヨ閲嶅啓
  enable_query_rewrite: true
  query_rewrite_prompt: "query_rewrite_prompt"

# 鐢熸垚鏅鸿兘浣撻厤缃?
generation_agent:
  agent_name: "GenerationAgent"
  agent_type: "generation"
  model: "primary"
  temperature: 0.7
  max_tokens: 2000
  prompt_template: "generation_system_prompt"

  # 鐢熸垚鍙傛暟
  enable_citation: true  # 鏄惁寮曠敤鏉ユ簮
  enable_hallucination_check: true  # 鏄惁妫€鏌ュ够瑙?
  max_context_length: 4000  # 鏈€澶т笂涓嬫枃闀垮害

  # 娴佸紡杈撳嚭
  streaming_chunk_size: 10

# 宸ュ叿璋冪敤鏅鸿兘浣撻厤缃?
tool_agent:
  agent_name: "ToolAgent"
  agent_type: "tool"
  model: "primary"
  temperature: 0.3
  max_tokens: 1000
  prompt_template: "tool_selection_prompt"

  # 宸ュ叿閰嶇疆
  available_tools:
    - "web_search"
    - "calculator"
    - "database_query"
    - "translation"
    - "datetime"
    - "novel_generator"
    - "script_generator"
    - "content_optimizer"
    - "weather_mcp"
    - "news_mcp"
    - "wikipedia_mcp"
    - "exchange_rate_mcp"
    - "ip_lookup_mcp"

  # 瓒呮椂鍜岄噸璇曢厤缃?
  tool_timeout: 30  # 宸ュ叿璋冪敤瓒呮椂鏃堕棿锛堢锛?
  max_retries: 2  # 鏈€澶ч噸璇曟鏁帮紙澶辫触鍚庨噸璇曪級
  retry_delay: 1.0  # 閲嶈瘯寤惰繜锛堢锛?
  max_tool_calls: 5  # 鏈€澶у伐鍏疯皟鐢ㄦ鏁?

  # 鎬ц兘鐩戞帶
  enable_performance_monitoring: true  # 鏄惁鍚敤鎬ц兘鐩戞帶
  log_performance_stats: true  # 鏄惁璁板綍鎬ц兘缁熻鍒版棩蹇?

# 鏂囦欢澶勭悊鏅鸿兘浣撻厤缃?
file_processor_agent:
  agent_name: "FileProcessorAgent"
  agent_type: "file_processor"
  model: "primary"
  temperature: 0.5
  max_tokens: 1500

  # 鏀寔鐨勬枃浠剁被鍨?
  supported_formats:
    - "pdf"
    - "docx"
    - "xlsx"
    - "txt"
    - "md"
    - "csv"

  # 鏂囦欢澶у皬闄愬埗锛圡B锛?
  max_file_size: 50

  # 鏂囨湰鍒嗗潡鍙傛暟
  chunk_size: 1000
  chunk_overlap: 100

# 瀵硅瘽鍘嗗彶閰嶇疆
conversation_history:
  max_history_length: 10  # 鏈€澶氫繚鐣欑殑鍘嗗彶娑堟伅鏁?
  include_agent_executions: true  # 鏄惁鍖呭惈鏅鸿兘浣撴墽琛岃褰?
  format: "messages"  # messages/text

