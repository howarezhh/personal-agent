# 智能体配置文件

# 通用配置
common:
  max_iterations: 10  # 最大迭代次数
  timeout: 300  # 超时时间（秒）
  enable_streaming: true  # 是否启用流式输出
  save_execution_records: true  # 是否保存执行记录

# 路由智能体配置
router_agent:
  agent_name: "RouterAgent"
  agent_type: "router"
  model: "primary"  # 使用主模型
  temperature: 0.3  # 较低温度，保证决策稳定性
  max_tokens: 500
  prompt_template: "router_system_prompt"  # 提示词模板名称

  # 决策类型
  decision_types:
    - "direct_answer"  # 直接回答
    - "retrieval"  # 检索知识库
    - "tool_call"  # 调用工具
    - "multi_agent"  # 多智能体协作

  # 置信度阈值
  confidence_threshold: 0.7

# 检索智能体配置
retrieval_agent:
  agent_name: "RetrievalAgent"
  agent_type: "retrieval"
  model: "primary"
  temperature: 0.5
  max_tokens: 1000
  prompt_template: "retrieval_system_prompt"

  # 检索参数
  top_k: 5  # 返回前K个结果
  similarity_threshold: 0.3  # 相似度阈值（L2距离转换后的相似度范围约0-0.5，0.3是合理的阈值）
  enable_rerank: true  # 是否启用重排序
  rerank_top_k: 3  # 重排序后返回的结果数
  enable_summary: false  # 是否生成检索结果摘要（使用LLM，会增加延迟）

  # 查询重写
  enable_query_rewrite: true
  query_rewrite_prompt: "query_rewrite_prompt"

# 生成智能体配置
generation_agent:
  agent_name: "GenerationAgent"
  agent_type: "generation"
  model: "primary"
  temperature: 0.7
  max_tokens: 2000
  prompt_template: "generation_system_prompt"

  # 生成参数
  enable_citation: true  # 是否引用来源
  enable_hallucination_check: true  # 是否检查幻觉
  max_context_length: 4000  # 最大上下文长度

  # 流式输出
  streaming_chunk_size: 10

# 工具调用智能体配置
tool_agent:
  agent_name: "ToolAgent"
  agent_type: "tool"
  model: "primary"
  temperature: 0.3
  max_tokens: 1000
  prompt_template: "tool_selection_prompt"

  # 工具配置
  available_tools:
    - "web_search"
    - "calculator"
    - "database_query"
    - "translation"
    - "datetime"
    - "novel_generator"
    - "script_generator"
    - "content_optimizer"
    - "weather_mcp"
    - "news_mcp"
    - "wikipedia_mcp"
    - "exchange_rate_mcp"
    - "ip_lookup_mcp"

  # 超时和重试配置
  tool_timeout: 30  # 工具调用超时时间（秒）
  max_retries: 2  # 最大重试次数（失败后重试）
  retry_delay: 1.0  # 重试延迟（秒）
  max_tool_calls: 5  # 最大工具调用次数

  # 性能监控
  enable_performance_monitoring: true  # 是否启用性能监控
  log_performance_stats: true  # 是否记录性能统计到日志

# 文件处理智能体配置
file_processor_agent:
  agent_name: "FileProcessorAgent"
  agent_type: "file_processor"
  model: "primary"
  temperature: 0.5
  max_tokens: 1500

  # 支持的文件类型
  supported_formats:
    - "pdf"
    - "docx"
    - "xlsx"
    - "txt"
    - "md"
    - "csv"

  # 文件大小限制（MB）
  max_file_size: 50

  # 文本分块参数
  chunk_size: 1000
  chunk_overlap: 100

# 对话历史配置
conversation_history:
  max_history_length: 10  # 最多保留的历史消息数
  include_agent_executions: true  # 是否包含智能体执行记录
  format: "messages"  # messages/text
