  ip_lookup_mcp:
    enabled: true
    type: mcp
    expose_to_agent: true
    class_path: backend.tools.mcp.ip_lookup_mcp.IPLookupMCP

common:
  default_timeout: 30
  enable_cache: true
  cache_ttl: 300
  max_retries: 3

calculator:
  max_expression_length: 1000
  timeout: 5

web_search:
  api_url: https://serpapi.com/search
  timeout: 15
  max_results: 10

database:
  timeout: 30

mcp:
  timeout: 10
  max_retries: 3
  retry_delay: 1.0

news_mcp:
  api_key: ""
